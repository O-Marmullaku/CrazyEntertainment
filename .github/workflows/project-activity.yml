name: Refresh project activity

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

concurrency:
  group: project-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read latest private-project commits
        env:
          ACTIVITY_READ_TOKEN: ${{ secrets.ACTIVITY_READ_TOKEN }}
          ACTIVITY_SOURCES_JSON: ${{ secrets.ACTIVITY_SOURCES_JSON }}
        run: python3 tools/refresh-activity.py
      - name: Publish changed dates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- activity.json; then
            echo "No newer project commits."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity.json
          git commit -m "Refresh public project activity dates"
          git push origin HEAD:main
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
